# Build the analysis container and publish it, on a version tag.
#
# The image carries the environment and none of the analysis code, so it is
# built once per environment change rather than once per commit: a tag is the
# right trigger, a push to main is not. Rebuilding an existing tag is refused by
# the registry, which is the point -- a published image that can change is not a
# record of anything.
#
# Pull it with Apptainer, which is what the pipeline uses:
#
#   apptainer pull oras://ghcr.io/dralperenuysal/mitofeasible:1.0.0
#
# This is a SIF published as an ORAS artifact, not a runnable OCI image, so
# `docker pull` will not work on it. That is deliberate: one recipe
# (env/mitofeasible.def) produces the image the cluster actually runs, rather
# than a Dockerfile kept in step with it by hand.

name: container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 1.0.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # x86_64 only: env/versions.lock pins bioconda builds of STAR and samtools
    # that exist for linux-64 alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim runner disk
        # The conda environment is a few GB and the runner ships with toolchains
        # this build has no use for.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install Apptainer
        # Pinned, and from the project's own release rather than a third-party
        # action: the version that builds the image is part of what the image is.
        env:
          APPTAINER_VERSION: 1.3.6
        run: |
          set -euo pipefail
          deb=apptainer_${APPTAINER_VERSION}_amd64.deb
          curl -fsSLO "https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/${deb}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "./${deb}"
          apptainer --version

      - name: Resolve the tag
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            v="${{ inputs.tag }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:$v" >> "$GITHUB_OUTPUT"

      - name: Build
        # --fakeroot is not needed: the definition installs into /opt as root
        # inside an unprivileged user namespace, which the runner allows.
        run: apptainer build mitofeasible.sif env/mitofeasible.def

      - name: Check the image before publishing it
        # The pipeline's selftests need no data, so the image can be exercised
        # against the checkout here rather than trusted on sight.
        run: |
          set -euo pipefail
          apptainer exec mitofeasible.sif STAR --version
          apptainer exec mitofeasible.sif samtools --version | head -1
          apptainer exec mitofeasible.sif haplogrep --version || true
          MTCOV_REPO=$PWD apptainer exec --bind "$PWD" mitofeasible.sif \
            python3 scripts/mitofeasible.py --selftest
          for f in scripts/*.py; do
            grep -q selftest "$f" || continue
            case $(basename "$f") in
              06_haplogroup.py) a=selftest ;;
              *)                a=--selftest ;;
            esac
            apptainer exec --bind "$PWD" mitofeasible.sif python3 "$f" "$a" >/dev/null \
              || { echo "selftest failed: $f"; exit 1; }
          done
          echo "all selftests pass inside the image"

      - name: Publish
        # Credentials go through the environment rather than `registry login`:
        # the subcommand was renamed between Apptainer versions, these variables
        # were not, and they cover oras:// as well as docker://.
        env:
          REF: ${{ steps.ver.outputs.ref }}
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: apptainer push mitofeasible.sif "oras://$REF"

      - name: Record what was published
        env:
          REF: ${{ steps.ver.outputs.ref }}
        run: |
          set -euo pipefail
          {
            echo "## Published"
            echo
            echo '```'
            echo "apptainer pull oras://$REF"
            echo '```'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| size | $(du -h mitofeasible.sif | cut -f1) |"
            echo "| sha256 | \`$(sha256sum mitofeasible.sif | cut -d' ' -f1)\` |"
            echo "| base image | pinned by digest in \`env/mitofeasible.def\` |"
            echo "| architecture | x86_64 |"
          } >> "$GITHUB_STEP_SUMMARY"
